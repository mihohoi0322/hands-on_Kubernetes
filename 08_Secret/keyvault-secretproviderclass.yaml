apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sc-demo-keyvault-csi
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "<USER_ASSIGNED_CLIENT_ID>"
    keyvaultName: "<YOUR_KEYVAULT_NAME>"
    tenantId: "<YOUR_TENANT_ID>"
    cloudName: ""
    objects: |
      array:
        - |
          objectName: <YOUR_SECRET_NAME>
          objectType: secret
          objectVersion: ""
  secretObjects:
    - secretName: keyvault-synced-secret
      type: Opaque
      data:
        - objectName: <YOUR_SECRET_NAME>
          key: secret-value