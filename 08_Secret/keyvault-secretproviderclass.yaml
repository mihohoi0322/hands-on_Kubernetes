# Azure Key Vault CSI Driver 用 SecretProviderClass サンプル
# 前提: AKS クラスターに Secrets Store CSI Driver + Azure Key Vault Provider が導入済み
# 参考: https://learn.microsoft.com/azure/aks/csi-secrets-store-driver
# Workload Identity または Pod Managed Identity を利用して Key Vault へ認証することを推奨
# （本番ではクライアントシークレットを直接使わない）

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: wordpress-kv
  labels:
    app: wordpress
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"                 # 旧 AAD Pod Identity (非推奨化) を使う場合 true。Workload Identity 時は false
    useVMManagedIdentity: "true"            # システム / ユーザー割当マネージドIDを Node が持つ場合に true
    userAssignedIdentityID: <OPTIONAL-USER-ASSIGNED-IDENTITY-CLIENT-ID> # ユーザー割当 MI を使う場合 Client ID
    keyvaultName: <YOUR_KEYVAULT_NAME>
    cloudName: AzurePublicCloud
    tenantId: <YOUR_TENANT_ID>
    # objectName は Key Vault 内のシークレット名。version 未指定で最新を取得。
    objects: |
      array:
        - | 
          objectName: mysql-root-password
          objectType: secret
        - | 
          objectName: mysql-database
          objectType: secret
        - | 
          objectName: mysql-user
          objectType: secret
        - | 
          objectName: mysql-password
          objectType: secret
  secretObjects:
    # 同期された K8s Secret を作り、従来通り envFrom: secretRef: でも利用できるようにする
    - secretName: wordpress-db-secret-kv
      type: Opaque
      data:
        - objectName: mysql-root-password
          key: MYSQL_ROOT_PASSWORD
        - objectName: mysql-database
          key: MYSQL_DATABASE
        - objectName: mysql-user
          key: MYSQL_USER
        - objectName: mysql-password
          key: MYSQL_PASSWORD
        # WordPress が期待する名称（再利用）
        - objectName: mysql-user
          key: WORDPRESS_DB_USER
        - objectName: mysql-password
          key: WORDPRESS_DB_PASSWORD
        - objectName: mysql-database
          key: WORDPRESS_DB_NAME
        # WORDPRESS_DB_HOST は Service 名を直接使用するので Key Vault からは取得不要

---
# Workload Identity を使う場合 (推奨) は、この ServiceAccount にアノテーションを付与する。
# 例: Azure AD で federated identity credential を設定し、以下 annotation 追加:
#   azure.workload.identity/client-id: <USER_ASSIGNED_MI_CLIENT_ID>
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wordpress-app-sa
  labels:
    app: wordpress
    component: app
  annotations: {}
