apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cronjob
  labels:
    app: hello-cronjob
spec:
  schedule: "*/5 * * * *" # 5分ごと
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: hello-cronjob
        spec:
          restartPolicy: OnFailure
          containers:
          - name: hello
            image: busybox:1.36
            command: ["/bin/sh", "-c", "date; echo Hello from CronJob"]
