apiVersion: v1
kind: Service
metadata:
  name: my-deployment-svc
  labels:
    app: myDeployment
  annotations: {}
spec:
  type: LoadBalancer
  selector:
    app: myDeployment
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
  # クライアントのソースIPを保持したい場合は externalTrafficPolicy: Local を検討してください
  # externalTrafficPolicy: Local
  # 固定の Public IP を使いたい場合は Azure 側で静的 IP を割り当てて loadBalancerIP に設定します
  # loadBalancerIP: <AZURE_RESERVED_IP>