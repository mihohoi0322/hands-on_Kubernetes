## WordPress + MySQL サンプル (Secret 連携)
# MySQL Deployment & Service, WordPress Deployment & Service.
# 共通 Secret (wordpress-db-secret) から DB 接続情報を注入。
# 本番は PVC / Key Vault CSI Driver 等を利用してください。

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-mysql
  labels:
    app: wordpress
    tier: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
      tier: db
  template:
    metadata:
      labels:
        app: wordpress
        tier: db
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: wordpress-db-secret
          ports:
            - containerPort: 3306
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["/bin/sh","-c","mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD || exit 1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-mysql
  labels:
    app: wordpress
    tier: db
spec:
  type: ClusterIP
  selector:
    app: wordpress
    tier: db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-web
  labels:
    app: wordpress
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
      tier: frontend
  template:
    metadata:
      labels:
        app: wordpress
        tier: frontend
    spec:
      containers:
        - name: wordpress
          image: wordpress:6.5-apache
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: wordpress-db-secret
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wp-blob-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-web
  labels:
    app: wordpress
    tier: frontend
  annotations:
    # 内部 LB が必要ならアンコメント:
    # service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: wordpress
    tier: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80

## 適用手順 (参考)
# kubectl apply -f 08_Secret/secret.yaml
# kubectl apply -f 08_Secret/deployment.yaml
# kubectl get pods -l app=wordpress -w
# 外部 IP 付与後: http://<EXTERNAL-IP>/ へアクセス
# 削除:
# kubectl delete -f 08_Secret/deployment.yaml -f 08_Secret/secret.yaml
