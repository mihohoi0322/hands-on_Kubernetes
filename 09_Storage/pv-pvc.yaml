# Dynamic provisioning example: PVC only (StorageClass 'blob-fuse' will create PV)
# 旧静的 PV 定義は削除。必要なら git 履歴を参照してください。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wp-blob-pvc
  labels:
    app: wordpress
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: blob-fuse
  resources:
    requests:
      storage: 5Gi
