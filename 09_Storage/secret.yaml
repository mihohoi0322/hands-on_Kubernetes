apiVersion: v1
kind: Secret
metadata:
  name: wordpress-db-secret
  labels:
    app: wordpress
    component: database
type: Opaque
# stringData を使うことで Git 上では平文で見やすく、適用時に base64 エンコードされます。
# 本番では: Azure Key Vault + CSI Driver / External Secrets Operator 等を検討してください。
stringData:
  # MySQL 用
  MYSQL_ROOT_PASSWORD: rootpass123
  MYSQL_DATABASE: wordpress
  MYSQL_USER: wpuser
  MYSQL_PASSWORD: wppass123
  # WordPress 用 (期待される環境変数名)
  WORDPRESS_DB_HOST: wordpress-mysql
  WORDPRESS_DB_USER: wpuser
  WORDPRESS_DB_PASSWORD: wppass123
  WORDPRESS_DB_NAME: wordpress
  # Blob Storage (CSI Driver 用) ※実際の値を設定
  azurestorageaccountname: wpcontent
  azurestorageaccountkey: 8k6Pya0xoqBRczutNwp5C0U/Cmq/vdOPMzkEqvYfYxm0tedDPE+UwP9nXZFfiGPB5H25U4OjL4f8+ASt+mzSIA==
