## HPA 検証用 Deployment + HorizontalPodAutoscaler サンプル
# - autoscaling/v2 を使用し CPU とメモリ両方の平均利用率でスケール
# - リソース requests が設定されていないと平均利用率(%)計算ができないので注意
#
# 負荷生成例:
#   kubectl run load --image=busybox:1.36 -- /bin/sh -c "while true; do wget -q -O- http://<SERVICE_IP>/ > /dev/null; done"
# または kubectl exec で apachebench/hey などを利用

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo
  labels:
    app: hpa-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hpa-demo
  template:
    metadata:
      labels:
        app: hpa-demo
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m      # HPA のターゲット計算基準
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: hpa-demo-svc
  labels:
    app: hpa-demo
spec:
  selector:
    app: hpa-demo
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-demo
  labels:
    app: hpa-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hpa-demo
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100   # 1 回のスケールで最大 100% 増 (2→4→8 ...)
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 60   # 急激な縮小を防ぐ
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60  # 目標: requests 指定 CPU の 60%
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70  # 目標: requests 指定 Memory の 70%
