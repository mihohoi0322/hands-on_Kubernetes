# Failure scenario samples for probes
# 1) Readiness toggle (exec probe) – simulate dependency outage without restarting container
# 2) Liveness toggle (exec probe) – simulate application dead status leading to restart
# 3) Startup failure – startupProbe times out -> container restarted before becoming Ready

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness-toggle
  labels:
    app: probe-demo
    scenario: readiness-toggle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-demo
      scenario: readiness-toggle
  template:
    metadata:
      labels:
        app: probe-demo
        scenario: readiness-toggle
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command:
          - /bin/sh
          - -c
          - >-
            echo 'Starting readiness toggle demo';
            # main loop just sleeps; readiness determined by probe script
            while true; do sleep 3600; done
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        # readinessProbe: fail if /tmp/force-not-ready exists
        readinessProbe:
          exec:
            command: ["/bin/sh","-c","[ -f /tmp/force-not-ready ] && exit 1 || exit 0"]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 2
          successThreshold: 1
        # livenessProbe kept simple to always succeed (container is 'alive')
        livenessProbe:
          exec:
            command: ["/bin/sh","-c","echo alive > /dev/null"]
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-toggle-svc
  labels:
    app: probe-demo
    scenario: readiness-toggle
spec:
  selector:
    app: probe-demo
    scenario: readiness-toggle
  # No ports needed (pure probe demonstration), but define one dummy to illustrate
  ports:
  - name: dummy
    port: 80
    targetPort: 9999

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liveness-toggle
  labels:
    app: probe-demo
    scenario: liveness-toggle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-demo
      scenario: liveness-toggle
  template:
    metadata:
      labels:
        app: probe-demo
        scenario: liveness-toggle
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command:
          - /bin/sh
          - -c
          - >-
            echo 'Starting liveness toggle demo';
            # create a heartbeat file updated periodically
            while true; do date > /tmp/heartbeat; sleep 2; done
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        # livenessProbe fails if /tmp/force-dead exists OR heartbeat file is older than 10s
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - >-
                if [ -f /tmp/force-dead ]; then exit 1; fi;
                if [ -f /tmp/heartbeat ]; then
                  now=$(date +%s); hb=$(date +%s -r /tmp/heartbeat 2>/dev/null || echo 0);
                  age=$((now - hb));
                  [ "$age" -gt 10 ] && exit 1 || exit 0;
                else exit 1; fi
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["/bin/sh","-c","[ -f /tmp/force-not-ready ] && exit 1 || exit 0"]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: liveness-toggle-svc
  labels:
    app: probe-demo
    scenario: liveness-toggle
spec:
  selector:
    app: probe-demo
    scenario: liveness-toggle
  ports:
  - name: dummy
    port: 80
    targetPort: 9999

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: startup-failure
  labels:
    app: probe-demo
    scenario: startup-failure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-demo
      scenario: startup-failure
  template:
    metadata:
      labels:
        app: probe-demo
        scenario: startup-failure
    spec:
      containers:
      - name: slow-app
        image: busybox:1.36
        command:
          - /bin/sh
          - -c
          - >-
            echo 'Simulating long init (will exceed startupProbe budget)';
            sleep 60; echo 'Should not reach here before restart';
            while true; do sleep 30; done
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        # Allow only 25s (5 * 5) for startup; we sleep 60 -> probe fails -> restart
        startupProbe:
          exec:
            command: ["/bin/sh","-c","echo checking startup; exit 1"]
          periodSeconds: 5
          failureThreshold: 5
          timeoutSeconds: 1
        # liveness/readiness not necessary; demo is startup failure

# USAGE (reference – do not apply these comments):
# kubectl apply -f failure-scenarios.yaml
# Trigger readiness failure:
#   POD=$(kubectl get pods -l scenario=readiness-toggle -o jsonpath='{.items[0].metadata.name}')
#   kubectl exec $POD -- sh -c 'touch /tmp/force-not-ready'
#   kubectl get pod $POD -w   # READY が 0/1 へ
# Recover:
#   kubectl exec $POD -- rm /tmp/force-not-ready
# Trigger liveness failure (graceful):
#   POD=$(kubectl get pods -l scenario=liveness-toggle -o jsonpath='{.items[0].metadata.name}')
#   kubectl exec $POD -- sh -c 'touch /tmp/force-dead'
#   kubectl describe pod $POD | grep -i liveness -A2
# Simulate heartbeat stall:
#   kubectl exec $POD -- sh -c 'pkill sleep'  # stops loop; heartbeat ages
# Observe RESTARTS increment
# Startup failure:
#   POD=$(kubectl get pods -l scenario=startup-failure -o name)
#   kubectl describe $POD | grep -i startup
#   Shows repeated startupProbe failures and restarts.
